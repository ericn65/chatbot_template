# El orden del cuestionario se controla aquí.
PHASES: [presentation, formulaires, questions, audio_questions, conclusion]
QUESTIONS:
  es:
    presentation:
      - text: "¡Hola! Vamos a completar un breve cuestionario. Para empezar, escribe ES (español). Puedes reiniciar con /start."
    formulaires:
      - question: "¿Cómo te llamas?"
        type: text
      - question: "¿Cuál es tu animal favorito?"
        type: text
      - question: "¿Cuánto te gustan las matemáticas? Responde con un número entero del 0 al 10."
        type: number
        min: 0
        max: 10
    questions:
      - question: "¿Sobre qué día quieres hablar?"
        type: text
      - question: "¿En qué momento del día?"
        type: text
    audio_questions:
      - question: "Cuéntame cómo ha ido tu día en una nota de voz de al menos 20 segundos."
        type: audio
        min_duration: 20
    conclusion:
      - text: "¡Gracias! Hemos terminado el cuestionario. Escribe /start para empezar otro."
